# Файл описания Gradle Wrapper.
# Сам gradle-wrapper.jar здесь намеренно отсутствует: это бинарник, который
# нельзя создать без сети. Варианты:
#   * сборка в GitHub Actions — workflow ставит Gradle сам, wrapper не нужен;
#   * Android Studio — сам предложит создать wrapper;
#   * вручную: установи Gradle 8.9 и выполни в папке android/ команду
#         gradle wrapper --gradle-version 8.9
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
