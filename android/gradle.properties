org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# org.gradle.parallel НЕ включать. С плагином Chaquopy параллельная сборка
# приводит к падению :app:compileDebugKotlin с ошибкой
#   "Current thread does not hold the state lock for root project"
# Это известный баг (chaquo/chaquopy#1339, gradle/gradle#15730).
# Модуль в проекте один, поэтому параллельность всё равно ничего не ускоряет.
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
